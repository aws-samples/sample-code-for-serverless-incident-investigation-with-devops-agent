AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Order Processing Service - Lambda deployment for DevOps Agent Demo

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 256
    Tags:
      auto-delete: "no"

Resources:
  OrderRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: order-records
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
      Tags:
        - Key: auto-delete
          Value: "no"

  OrderProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: order-processing-service
      Handler: app.lambda_handler.handler
      CodeUri: ../
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: order-records
          CONNECTION_POOL_SIZE: "10"
          SERVICE_NAME: order-processing-service
          LOG_LEVEL: INFO
          PAYMENT_VALIDATION_FUNCTION_NAME: payment-validation-service
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrderRecordsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:payment-validation-service
      FunctionUrlConfig:
        AuthType: NONE
      Tags:
        auto-delete: "no"
      Events:
        Api:
          Type: HttpApi

  OrderProcessingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/order-processing-service
      RetentionInDays: 7
      Tags:
        - Key: auto-delete
          Value: "no"

  # Payment Validation Service Resources
  PaymentRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: payment-records
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: payment_id
          AttributeType: S
      KeySchema:
        - AttributeName: payment_id
          KeyType: HASH
      Tags:
        - Key: auto-delete
          Value: "no"

  PaymentValidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: payment-validation-service
      Handler: app.payment_handler.handler
      CodeUri: ../
      Environment:
        Variables:
          PAYMENT_TABLE_NAME: payment-records
          SERVICE_NAME: payment-validation-service
          LOG_LEVEL: INFO
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentRecordsTable
      Tags:
        auto-delete: "no"

  PaymentValidationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/payment-validation-service
      RetentionInDays: 7
      Tags:
        - Key: auto-delete
          Value: "no"

  PaymentRecordsThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: payment-records-throttle-alarm
      AlarmDescription: Triggers when DynamoDB throttled requests exceed 0 on payment-records table
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: payment-records
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  ErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: order-processing-error-rate-high
      AlarmDescription: Triggers when Lambda error count exceeds threshold
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrderProcessingFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: order-processing-latency-p99-high
      AlarmDescription: Triggers when Lambda p99 duration exceeds 5 seconds
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrderProcessingFunction
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: platform-alerts-notifications
      Tags:
        - Key: auto-delete
          Value: "no"

  # Alarm Forwarder — receives SNS alarm notifications and forwards to DevOps Agent webhook
  AlarmForwarderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: alarm-webhook-forwarder
      Handler: app.alarm_forwarder.handler
      CodeUri: ../
      Runtime: python3.12
      MemorySize: 128
      Timeout: 30
      Environment:
        Variables:
          WEBHOOK_URL: https://event-ai.us-east-1.api.aws/webhook/generic/7a7dadeb-9d9e-444d-ba70-b08882e2c485
          WEBHOOK_SECRET: txRGoHFxwPoee/Sk6URZNNy2UxgNq7FmHc1XDCh1dbE=
      Events:
        SNSEvent:
          Type: SNS
          Properties:
            Topic: !Ref AlertsTopic
      Tags:
        auto-delete: "no"

  AlarmForwarderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/alarm-webhook-forwarder
      RetentionInDays: 7
      Tags:
        - Key: auto-delete
          Value: "no"

Outputs:
  FunctionUrl:
    Value: !GetAtt OrderProcessingFunctionUrl.FunctionUrl
    Description: Public URL for the order processing service
  ApiUrl:
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Description: API Gateway URL
  FunctionName:
    Value: !Ref OrderProcessingFunction
  DynamoDBTableName:
    Value: !Ref OrderRecordsTable
